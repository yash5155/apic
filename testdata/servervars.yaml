openapi: 3.0.0
info:
  title: Server Vars
  version: "1"
servers:
  - url: "{scheme}://{host}:{port}/{basePath}"
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: api.example.com
      port:
        default: "443"
      basePath:
        default: v2
  - url: "https://{tenant}.example.com"
    # tenant has no default and no enum -> token left in place
    variables:
      tenant: {}
paths:
  /ping:
    get:
      summary: Ping
